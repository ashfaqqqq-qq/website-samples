<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aleez Perfumes — Full Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HOW TO USE THIS FILE
   ------------------------------------------------------------
   This is a self-contained "Phase 2" add-on for Aleez Perfumes.
   It focuses on the catalog engine (search, bestsellers, quick
   view modal, login UI, wishlist) with the same ivory/gold look
   as your main site. Merge the <nav>/hero/footer chrome from
   your master file around this if you want — the important
   part is the PRODUCTS data + the JS engine near the bottom.

   WHERE TO PLUG IN A REAL DATABASE (see the "SUPABASE HOOKS"
   comment block near the bottom of the <script> for exactly
   what to change).
   ============================================================ */
:root{
  --ivory:#F8F6F0; --cream:#EFECE3; --card:#FFFFFF; --beige:#E8E2D6;
  --ink:#171714; --muted:#68645C; --border:#DCD6C9; --gold:#B3915F;
  --gold-soft:rgba(179,145,95,0.14); --danger:#B3554A;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--ivory);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.serif{font-family:'Playfair Display',serif;font-weight:500;letter-spacing:0.01em;}
a{color:inherit;text-decoration:none;}
.container{max-width:1180px;margin:0 auto;padding:0 24px;}
.eyebrow{font-size:11.5px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);font-weight:600;}
img,svg{max-width:100%;display:block;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;border-radius:3px;cursor:pointer;border:1px solid transparent;transition:all .25s ease;min-height:44px;}
.btn-dark{background:var(--ink);color:var(--ivory);} .btn-dark:hover{background:#000;}
.btn-outline{background:transparent;color:var(--ink);border-color:var(--ink);}
.btn-outline:hover{background:var(--ink);color:var(--ivory);}
.btn-sm{padding:9px 14px;font-size:11.5px;min-height:36px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------------- TOP BAR ---------------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(248,246,240,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.topbar-inner{max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:18px;}
.logo{font-family:'Playfair Display',serif;font-size:21px;white-space:nowrap;}
.search-wrap{flex:1;position:relative;}
.search-wrap input{width:100%;padding:12px 42px 12px 16px;border:1px solid var(--border);border-radius:24px;background:var(--card);font-size:14.5px;font-family:'Inter',sans-serif;}
.search-wrap input:focus{outline:2px solid var(--gold);outline-offset:1px;}
.search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;}
.icon-btn .badge{position:absolute;top:-4px;right:-4px;background:var(--gold);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 3px;}

/* ---------------- FILTER CHIPS ---------------- */
.filter-row{display:flex;gap:10px;overflow-x:auto;padding:16px 24px 4px;max-width:1180px;margin:0 auto;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:9px 18px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:13px;cursor:pointer;white-space:nowrap;transition:all .2s ease;}
.chip.active{background:var(--ink);color:var(--ivory);border-color:var(--ink);}
.result-count{max-width:1180px;margin:8px auto 0;padding:0 24px;font-size:13px;color:var(--muted);}

/* ---------------- BESTSELLERS ---------------- */
.section{padding:44px 0;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px;}
.section-head h2{font-size:26px;}
.bestseller-scroll{display:flex;gap:16px;overflow-x:auto;padding:4px 24px 10px;scroll-snap-type:x proximity;}
.bestseller-scroll .card{scroll-snap-align:start;flex:0 0 190px;}

/* ---------------- PRODUCT GRID ---------------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;padding:0 24px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden;cursor:pointer;position:relative;transition:transform .25s ease, box-shadow .25s ease;}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 30px -20px rgba(23,23,20,.35);}
.card .thumb{aspect-ratio:1/1.1;position:relative;display:flex;align-items:center;justify-content:center;}
.card .thumb svg{width:56%;}
.card-badge{position:absolute;top:8px;left:8px;background:var(--gold);color:#fff;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:4px 8px;border-radius:20px;z-index:2;}
.wish-btn{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.85);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer;}
.wish-btn svg{width:16px;height:16px;}
.wish-btn.active svg{fill:var(--danger);stroke:var(--danger);}
.card-info{padding:12px 14px 14px;}
.card-info .fam{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600;}
.card-info h3{font-size:14.5px;margin-top:4px;line-height:1.25;font-family:'Inter',sans-serif;font-weight:600;}
.card-info .inspired{font-size:11.5px;color:var(--muted);margin-top:2px;}
.card-info .price{margin-top:8px;font-size:13.5px;font-weight:600;}
.card-info .price span{color:var(--muted);font-weight:400;font-size:11.5px;}

.load-more-wrap{text-align:center;padding:28px 24px 0;}
.empty-state{padding:60px 24px;text-align:center;color:var(--muted);}

/* ---------------- QUICK VIEW MODAL (Zepto-style) ---------------- */
.overlay{position:fixed;inset:0;background:rgba(23,23,20,.55);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.overlay.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:201;background:var(--ivory);border-radius:18px 18px 0 0;max-width:520px;margin:0 auto;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.22,1,.36,1);max-height:88vh;overflow-y:auto;}
.sheet.open{transform:translateY(0);}
@media (min-width:640px){
  .sheet{top:6%;bottom:auto;border-radius:14px;max-height:88vh;}
}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:12px auto 0;}
.sheet-close{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;}
.sheet-visual{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%, #fff 0%, var(--beige) 100%);}
.sheet-visual svg{width:34%;}
.sheet-body{padding:22px 24px 28px;}
.sheet-body .fam{color:var(--gold);}
.sheet-body h2{font-size:24px;margin-top:6px;}
.sheet-body .inspired{color:var(--muted);font-size:13.5px;margin-top:4px;}
.note-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.note-tags span{font-size:11.5px;padding:5px 11px;border-radius:14px;background:var(--gold-soft);color:var(--gold);font-weight:600;}
.ml-select{margin-top:22px;}
.ml-select label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.ml-options{display:flex;gap:10px;}
.ml-opt{flex:1;border:1px solid var(--border);border-radius:6px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s ease;}
.ml-opt.active{border-color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--ink);}
.ml-opt .mlname{font-weight:600;font-size:14px;}
.ml-opt .mlprice{font-size:12.5px;color:var(--muted);margin-top:2px;}
.qty-row{display:flex;align-items:center;justify-content:space-between;margin-top:22px;}
.qty-row label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.qty-ctrl{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:24px;padding:6px 16px;}
.qty-ctrl button{background:none;border:none;font-size:18px;cursor:pointer;width:22px;color:var(--ink);}
.sheet-actions{display:flex;gap:10px;margin-top:24px;}
.sheet-actions .btn{flex:1;}

/* ---------------- LOGIN / ACCOUNT MODAL ---------------- */
.auth-sheet .sheet-body{padding-top:36px;}
.auth-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;}
.auth-tab{flex:1;text-align:center;padding:10px 0;font-size:13.5px;letter-spacing:.04em;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
.auth-tab.active{color:var(--ink);border-color:var(--ink);font-weight:600;}
.form-row{margin-top:14px;}
.form-row label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:7px;}
.form-row input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:4px;font-size:14.5px;background:var(--card);}
.auth-note{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.6;background:var(--gold-soft);padding:12px 14px;border-radius:6px;}
.account-loggedin .avatar{width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--ivory);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:22px;margin-bottom:10px;}
.account-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);font-size:14px;}

@media (max-width:640px){
  .topbar-inner{flex-wrap:wrap;}
  .logo{order:1;} .icon-btn{order:2;}
  .search-wrap{order:3;flex-basis:100%;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="#" class="logo">Aleez</a>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search CR7, JPG, oud, vanilla, 9PM…" autocomplete="off">
      <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="wishlistBtn" aria-label="Wishlist">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span class="badge" id="wishlistBadge" style="display:none;">0</span>
      </button>
      <button class="icon-btn" id="accountBtn" aria-label="Account">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      </button>
    </div>
  </div>
  <div class="filter-row" id="filterRow"></div>
  <div class="result-count" id="resultCount"></div>
</header>

<!-- BESTSELLERS -->
<section class="section" id="bestsellerSection">
  <div class="container section-head">
    <h2>Best Sellers</h2>
    <span class="eyebrow" style="color:var(--muted);">Our most-requested "inspired by" scents</span>
  </div>
  <div class="bestseller-scroll" id="bestsellerScroll"></div>
</section>

<!-- FULL CATALOG -->
<section class="section" id="catalogSection">
  <div class="container section-head">
    <h2>Full Catalog</h2>
  </div>
  <div class="grid" id="productGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">No fragrances match that search. Try "oud", "rose", or a note like "vanilla".</div>
  <div class="load-more-wrap"><button class="btn btn-outline" id="loadMoreBtn">Show More</button></div>
</section>

<!-- QUICK VIEW MODAL -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="quickView">
  <button class="sheet-close" id="closeQuick">✕</button>
  <div class="sheet-handle"></div>
  <div class="sheet-visual" id="qvVisual"></div>
  <div class="sheet-body">
    <div class="eyebrow fam" id="qvFamily">—</div>
    <h2 id="qvName">—</h2>
    <div class="inspired" id="qvInspired">—</div>
    <div class="note-tags" id="qvNotes"></div>

    <div class="ml-select">
      <label>Choose size</label>
      <div class="ml-options" id="qvSizes"></div>
    </div>

    <div class="qty-row">
      <label>Quantity</label>
      <div class="qty-ctrl">
        <button id="qtyMinus">−</button>
        <span id="qtyVal">1</span>
        <button id="qtyPlus">+</button>
      </div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-outline" id="qvWishlist">♡ Save</button>
      <button class="btn btn-dark" id="qvOrder">Order on WhatsApp</button>
    </div>
  </div>
</div>

<!-- LOGIN / ACCOUNT MODAL -->
<div class="overlay" id="overlayAuth"></div>
<div class="sheet auth-sheet" id="authSheet">
  <button class="sheet-close" id="closeAuth">✕</button>
  <div class="sheet-handle"></div>
  <div class="sheet-body" id="authBody">
    <!-- filled by JS: logged-out form OR logged-in account view -->
  </div>
</div>

<script>
(function(){

/* ============================================================
   1) PRODUCT DATA
   ------------------------------------------------------------
   Replace/extend CURATED_BESTSELLERS with your real hero SKUs.
   The generator below pads the catalog out past 150 items using
   note-family combinations so you have a working 150+ product
   grid today — swap in real names/photos as you finalize them.
   ============================================================ */
const FAMILY_NOTES = {
  'Woody Aromatic': ['Woody','Fresh','Musk'],
  'Oriental Vanilla': ['Vanilla','Amber','Sweet'],
  'Sweet Oriental': ['Vanilla','Musk','Sweet'],
  'Fresh Spicy': ['Fresh','Spicy','Woody'],
  'Spicy Leather': ['Leather','Spicy','Amber'],
  'Sweet Coffee': ['Sweet','Vanilla','Musk'],
  'Fruity Chypre': ['Fruity','Woody','Musk'],
  'Oud Woody': ['Oud','Woody','Amber'],
  'Oriental Woody': ['Oriental','Woody','Amber'],
  'Fresh Mint': ['Fresh','Citrus','Aquatic'],
  'Floral Chypre': ['Floral','Musk','Woody'],
  'Aquatic Fresh': ['Aquatic','Citrus','Fresh'],
  'Amber Spicy': ['Amber','Spicy','Sweet'],
  'Citrus Fresh': ['Citrus','Fresh'],
  'Rose Floral': ['Rose','Floral'],
  'Musk Clean': ['Musk','Sandalwood'],
  'Gourmand Sweet': ['Sweet','Vanilla'],
  'Leather Smoke': ['Leather','Tobacco']
};
const FAMILY_KEYS = Object.keys(FAMILY_NOTES);
const FAMILY_COLORS = {
  'Woody Aromatic':['#EFE6D3','#B99A66'], 'Oriental Vanilla':['#F8EFDF','#E7CE9F'],
  'Sweet Oriental':['#F6E7CE','#D9A85E'], 'Fresh Spicy':['#EAF0E7','#9FB98C'],
  'Spicy Leather':['#EFE4D6','#8B6A4A'], 'Sweet Coffee':['#EDE0D2','#6E4A30'],
  'Fruity Chypre':['#F3E6E2','#C98F7C'], 'Oud Woody':['#EFE4D0','#7C5A32'],
  'Oriental Woody':['#EEE4D3','#9C7A4A'], 'Fresh Mint':['#E7F1EE','#7EAFA2'],
  'Floral Chypre':['#F7EEEF','#D9AEB6'], 'Aquatic Fresh':['#E8F1F1','#7FA8AC'],
  'Amber Spicy':['#F4E7D0','#CB9A55'], 'Citrus Fresh':['#F8F2D8','#E6C871'],
  'Rose Floral':['#F8EEEB','#E1BEB7'], 'Musk Clean':['#F1EEE5','#C7BFAC'],
  'Gourmand Sweet':['#F8EFDF','#E9CE9F'], 'Leather Smoke':['#E9E3D6','#8B8072']
};

// Curated hero / best-selling "inspired by" scents
const CURATED_BESTSELLERS = [
  {name:'CR7', inspired:'Inspired by Cristiano Ronaldo Legacy', family:'Woody Aromatic'},
  {name:'JPG Signature', inspired:'Inspired by Jean Paul Gaultier Le Male', family:'Oriental Vanilla'},
  {name:'9PM Noir', inspired:'Inspired by Afnan 9PM', family:'Sweet Oriental'},
  {name:'Savage Wild', inspired:'Inspired by Dior Sauvage', family:'Fresh Spicy'},
  {name:'Bleu Homme', inspired:'Inspired by Bleu de Chanel', family:'Woody Aromatic'},
  {name:'Million Gold', inspired:'Inspired by Paco Rabanne 1 Million', family:'Spicy Leather'},
  {name:'Opium Noir', inspired:'Inspired by YSL Black Opium', family:'Sweet Coffee'},
  {name:'Aventus Royale', inspired:'Inspired by Creed Aventus', family:'Fruity Chypre'},
  {name:'Oud Prestige', inspired:'Inspired by Tom Ford Oud Wood', family:'Oud Woody'},
  {name:'Code Homme', inspired:'Inspired by Armani Code', family:'Oriental Woody'},
  {name:'Eros Blue', inspired:'Inspired by Versace Eros', family:'Fresh Mint'},
  {name:'Coco Noir', inspired:'Inspired by Chanel Coco Mademoiselle', family:'Floral Chypre'},
  {name:'Acqua Divina', inspired:'Inspired by Acqua di Giò', family:'Aquatic Fresh'},
  {name:'The One Elegance', inspired:'Inspired by D&G The One', family:'Amber Spicy'}
];

function priceForFamily(fam){
  const premium = ['Oud Woody','Fruity Chypre','Spicy Leather','Oriental Woody'];
  return premium.includes(fam) ? {p50:699, p100:1199} : {p50:599, p100:999};
}

const PREFIXES = ['Aleez','Noir','Velour','Lumière','Essence','Reserve','Elixir','Muse','Heritage','Atelier','Maison','Signature'];
const SUFFIXES = ['No. 1','No. 2','No. 3','Gold','Silver','Intense','Extrait','Homme','Femme','Unisex','Prestige','Édition'];

function buildCatalog(){
  const list = [];
  let id = 1;

  CURATED_BESTSELLERS.forEach(item => {
    const price = priceForFamily(item.family);
    list.push({
      id: id++, name: item.name, inspired: item.inspired, family: item.family,
      notes: FAMILY_NOTES[item.family], bestseller: true, ...price
    });
  });

  // Pad out to 150+ using prefix/family/suffix combinations.
  // Replace this block over time with your real SKUs.
  outer:
  for (let p = 0; p < PREFIXES.length; p++){
    for (let f = 0; f < FAMILY_KEYS.length; f++){
      for (let s = 0; s < SUFFIXES.length; s++){
        if (id > 170) break outer;
        const family = FAMILY_KEYS[f];
        const name = `${PREFIXES[p]} ${SUFFIXES[s]}`;
        const price = priceForFamily(family);
        list.push({
          id: id++, name, inspired: '', family,
          notes: FAMILY_NOTES[family], bestseller: false, ...price
        });
      }
    }
  }
  return list;
}

const PRODUCTS = buildCatalog();

/* ============================================================
   2) SVG THUMBNAIL (procedurally colored bottle icon)
   ============================================================ */
function bottleSVG(family, big){
  const [c1, c2] = FAMILY_COLORS[family] || ['#EFECE3','#B3915F'];
  const gid = 'g' + Math.random().toString(36).slice(2,9);
  return `<svg viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>
    </linearGradient></defs>
    <ellipse cx="60" cy="160" rx="34" ry="6" fill="#171714" opacity="0.08"/>
    <rect x="47" y="14" width="26" height="15" rx="2" fill="#171714"/>
    <rect x="54" y="4" width="12" height="14" rx="2" fill="${c2}"/>
    <path d="M40 29 Q40 26 45 26 L75 26 Q80 26 80 29 L86 56 Q88 66 88 76 L88 146 Q88 156 78 156 L42 156 Q32 156 32 146 L32 76 Q32 66 34 56 Z"
      fill="url(#${gid})" stroke="#DCD6C9" stroke-width="1"/>
    <rect x="43" y="76" width="34" height="42" rx="1" fill="rgba(255,255,255,0.55)" stroke="${c2}" stroke-width="0.8"/>
    <text x="60" y="100" text-anchor="middle" font-family="Playfair Display, serif" font-size="9" fill="#171714" letter-spacing="1">AZ</text>
  </svg>`;
}

/* ============================================================
   3) STATE + RENDER
   ============================================================ */
const state = {
  query:'', activeFilter:'all', visibleCount: 24,
  wishlist: JSON.parse(localStorage.getItem('aleez_wishlist') || '[]'),
  activeProduct: null, activeSize: null, qty: 1
};

const FILTERS = [{key:'all', label:'All'}, {key:'bestseller', label:'Bestsellers'}]
  .concat(FAMILY_KEYS.map(f => ({key:f, label:f})));

function saveWishlist(){
  localStorage.setItem('aleez_wishlist', JSON.stringify(state.wishlist));
  updateWishlistBadge();
}
function updateWishlistBadge(){
  const badge = document.getElementById('wishlistBadge');
  const n = state.wishlist.length;
  badge.style.display = n ? 'flex' : 'none';
  badge.textContent = n;
}
function toggleWishlist(id){
  const i = state.wishlist.indexOf(id);
  if (i === -1) state.wishlist.push(id); else state.wishlist.splice(i,1);
  saveWishlist();
  renderGrid(); renderBestsellers();
  if (state.activeProduct && state.activeProduct.id === id) syncWishlistBtn();
}

function renderFilters(){
  const row = document.getElementById('filterRow');
  row.innerHTML = FILTERS.map(f =>
    `<button class="chip ${state.activeFilter===f.key?'active':''}" data-filter="${f.key}">${f.label}</button>`
  ).join('');
  row.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      state.activeFilter = chip.dataset.filter;
      state.visibleCount = 24;
      renderFilters(); renderGrid();
    });
  });
}

function filteredProducts(){
  const q = state.query.trim().toLowerCase();
  return PRODUCTS.filter(p => {
    if (state.activeFilter === 'bestseller' && !p.bestseller) return false;
    if (state.activeFilter !== 'all' && state.activeFilter !== 'bestseller' && p.family !== state.activeFilter) return false;
    if (!q) return true;
    const hay = (p.name + ' ' + p.inspired + ' ' + p.family + ' ' + p.notes.join(' ')).toLowerCase();
    return hay.includes(q);
  });
}

function cardHTML(p){
  const wished = state.wishlist.includes(p.id);
  return `<div class="card" data-id="${p.id}">
    ${p.bestseller ? '<div class="card-badge">Best Seller</div>' : ''}
    <button class="wish-btn ${wished?'active':''}" data-wish="${p.id}" aria-label="Save to wishlist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
    </button>
    <div class="thumb">${bottleSVG(p.family)}</div>
    <div class="card-info">
      <div class="fam">${p.family}</div>
      <h3>${p.name}</h3>
      <div class="inspired">${p.inspired || p.notes.join(' · ')}</div>
      <div class="price">₹${p.p50}<span> / 50ML</span></div>
    </div>
  </div>`;
}

function renderBestsellers(){
  const wrap = document.getElementById('bestsellerScroll');
  const items = PRODUCTS.filter(p => p.bestseller);
  wrap.innerHTML = items.map(cardHTML).join('');
  wireCardEvents(wrap);
}

function renderGrid(){
  const all = filteredProducts();
  const shown = all.slice(0, state.visibleCount);
  const grid = document.getElementById('productGrid');
  const empty = document.getElementById('emptyState');
  const loadMore = document.getElementById('loadMoreBtn');
  grid.innerHTML = shown.map(cardHTML).join('');
  wireCardEvents(grid);
  empty.style.display = all.length ? 'none' : 'block';
  loadMore.style.display = shown.length < all.length ? 'inline-flex' : 'none';
  document.getElementById('resultCount').textContent =
    `${all.length} fragrance${all.length===1?'':'s'}${state.query ? ' for "' + state.query + '"' : ''}`;
}

function wireCardEvents(scope){
  scope.querySelectorAll('.wish-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); toggleWishlist(Number(btn.dataset.wish)); });
  });
  scope.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openQuickView(Number(card.dataset.id)));
  });
}

/* ============================================================
   4) QUICK VIEW (Zepto-style bottom sheet)
   ============================================================ */
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('quickView');

function openQuickView(id){
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  state.activeProduct = p; state.qty = 1;
  state.activeSize = '50ML';

  document.getElementById('qvVisual').innerHTML = bottleSVG(p.family, true);
  document.getElementById('qvFamily').textContent = p.family;
  document.getElementById('qvName').textContent = p.name;
  document.getElementById('qvInspired').textContent = p.inspired || 'Aleez original blend';
  document.getElementById('qvNotes').innerHTML = p.notes.map(n => `<span>${n}</span>`).join('');
  document.getElementById('qvSizes').innerHTML = `
    <div class="ml-opt active" data-size="50ML"><div class="mlname">50 ML</div><div class="mlprice">₹${p.p50}</div></div>
    <div class="ml-opt" data-size="100ML"><div class="mlname">100 ML</div><div class="mlprice">₹${p.p100}</div></div>`;
  document.getElementById('qvSizes').querySelectorAll('.ml-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.ml-opt').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      state.activeSize = opt.dataset.size;
    });
  });
  document.getElementById('qtyVal').textContent = state.qty;
  syncWishlistBtn();

  overlay.classList.add('open'); sheet.classList.add('open');
}
function closeQuickView(){ overlay.classList.remove('open'); sheet.classList.remove('open'); }
document.getElementById('closeQuick').addEventListener('click', closeQuickView);
overlay.addEventListener('click', closeQuickView);

document.getElementById('qtyMinus').addEventListener('click', () => {
  state.qty = Math.max(1, state.qty - 1);
  document.getElementById('qtyVal').textContent = state.qty;
});
document.getElementById('qtyPlus').addEventListener('click', () => {
  state.qty = Math.min(9, state.qty + 1);
  document.getElementById('qtyVal').textContent = state.qty;
});

function syncWishlistBtn(){
  const btn = document.getElementById('qvWishlist');
  const on = state.wishlist.includes(state.activeProduct.id);
  btn.textContent = on ? '♥ Saved' : '♡ Save';
}
document.getElementById('qvWishlist').addEventListener('click', () => {
  toggleWishlist(state.activeProduct.id);
  syncWishlistBtn();
});

document.getElementById('qvOrder').addEventListener('click', () => {
  const p = state.activeProduct;
  const price = state.activeSize === '100ML' ? p.p100 : p.p50;
  const msg = encodeURIComponent(
    `Hi Aleez Perfumes, I'd like to order:\n${p.name} (${p.family})\nSize: ${state.activeSize}\nQty: ${state.qty}\nPrice: ₹${price} each`
  );
  window.open('https://wa.me/919345526905?text=' + msg, '_blank');
});

/* ============================================================
   5) SEARCH / FILTERS / LOAD MORE
   ============================================================ */
document.getElementById('searchInput').addEventListener('input', (e) => {
  state.query = e.target.value; state.visibleCount = 24; renderGrid();
});
document.getElementById('loadMoreBtn').addEventListener('click', () => {
  state.visibleCount += 24; renderGrid();
});
document.getElementById('wishlistBtn').addEventListener('click', () => {
  state.activeFilter = 'all'; state.query = '';
  document.getElementById('searchInput').value = '';
  const wishedOnly = PRODUCTS.filter(p => state.wishlist.includes(p.id));
  const grid = document.getElementById('productGrid');
  grid.innerHTML = wishedOnly.length ? wishedOnly.map(cardHTML).join('') :
    '<p style="grid-column:1/-1;color:var(--muted);padding:20px 0;">No saved fragrances yet — tap the heart on any product.</p>';
  wireCardEvents(grid);
  document.getElementById('loadMoreBtn').style.display = 'none';
  document.getElementById('resultCount').textContent = `${wishedOnly.length} saved`;
  document.getElementById('catalogSection').scrollIntoView({behavior:'smooth'});
});

/* ============================================================
   6) LOGIN / ACCOUNT UI
   ------------------------------------------------------------
   This is FRONT-END ONLY. It stores a fake "session" in
   localStorage so you can see the flow. To make it real, see
   the SUPABASE HOOKS block below.
   ============================================================ */
const overlayAuth = document.getElementById('overlayAuth');
const authSheet = document.getElementById('authSheet');
const authBody = document.getElementById('authBody');

function currentUser(){
  return JSON.parse(localStorage.getItem('aleez_user') || 'null');
}

function renderAuth(){
  const user = currentUser();
  if (user){
    authBody.innerHTML = `
      <div class="account-loggedin">
        <div class="avatar">${user.name.charAt(0).toUpperCase()}</div>
        <h2>${user.name}</h2>
        <div class="inspired">${user.email}</div>
        <div class="account-row"><span>Saved fragrances</span><strong>${state.wishlist.length}</strong></div>
        <div class="account-row"><span>Order history</span><strong>Coming soon</strong></div>
        <button class="btn btn-outline" style="width:100%;margin-top:20px;" id="logoutBtn">Log out</button>
      </div>`;
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('aleez_user'); renderAuth();
    });
  } else {
    authBody.innerHTML = `
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">Log In</div>
        <div class="auth-tab" data-tab="signup">Sign Up</div>
      </div>
      <div id="authFormWrap"></div>
      <div class="auth-note">
        This form is UI-only right now. To turn it into real accounts (so people can log in from any device and you get an admin dashboard of orders), connect it to Supabase — see the comment in the site's source code for the two-line swap.
      </div>`;
    authBody.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        authBody.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderAuthForm(tab.dataset.tab);
      });
    });
    renderAuthForm('login');
  }
}

function renderAuthForm(mode){
  const wrap = document.getElementById('authFormWrap');
  wrap.innerHTML = `
    ${mode==='signup' ? '<div class="form-row"><label>Name</label><input type="text" id="authName" placeholder="Your name"></div>' : ''}
    <div class="form-row"><label>Email</label><input type="email" id="authEmail" placeholder="you@example.com"></div>
    <div class="form-row"><label>Password</label><input type="password" id="authPass" placeholder="••••••••"></div>
    <button class="btn btn-dark" id="authSubmit" style="width:100%;margin-top:18px;">${mode==='signup'?'Create Account':'Log In'}</button>
  `;
  document.getElementById('authSubmit').addEventListener('click', () => {
    /* ---------------- SUPABASE HOOKS ----------------
       Replace the block below with real calls once you've
       created a Supabase project, e.g.:

       const { data, error } = await supabase.auth.signUp({
         email: document.getElementById('authEmail').value,
         password: document.getElementById('authPass').value
       });
       // (and supabase.auth.signInWithPassword(...) for login)
       ------------------------------------------------- */
    const email = document.getElementById('authEmail').value.trim();
    const nameField = document.getElementById('authName');
    const name = nameField ? nameField.value.trim() : email.split('@')[0];
    if (!email) return;
    localStorage.setItem('aleez_user', JSON.stringify({name: name || 'Guest', email}));
    renderAuth();
  });
}

document.getElementById('accountBtn').addEventListener('click', () => {
  renderAuth();
  overlayAuth.classList.add('open'); authSheet.classList.add('open');
});
document.getElementById('closeAuth').addEventListener('click', () => {
  overlayAuth.classList.remove('open'); authSheet.classList.remove('open');
});
overlayAuth.addEventListener('click', () => {
  overlayAuth.classList.remove('open'); authSheet.classList.remove('open');
});

/* ============================================================
   INIT
   ============================================================ */
renderFilters();
renderBestsellers();
renderGrid();
updateWishlistBadge();

})();
</script>
</body>
</html>
